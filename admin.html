<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a3a">
<title>정보·데이터과학 학습관리 · 관리자</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e2a3a'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M32 24v11h8' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f2f6fb; --card:#fff; --ink:#1e2a3a; --ink-soft:#5b7091; --ink-faint:#93a6c0;
    --line:#e2ebf6; --blue:#2f6fd0; --blue-dark:#245bad; --blue-soft:#e8f0fc; --blue-tint:#f6f9fe;
    --red:#c25b5b; --red-soft:#fdf1f1; --green:#4fa89e;
    --sans:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
           "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Segoe UI", sans-serif;
    --mono:"SF Mono", ui-monospace, Menlo, Consolas, "D2Coding",
           "Nanum Gothic Coding", "Malgun Gothic", monospace;
    --shadow:0 1px 2px rgba(31,58,102,.04), 0 8px 24px rgba(31,58,102,.06);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  a{color:var(--blue)}

  /* 레이아웃 */
  *{scrollbar-width:thin; scrollbar-color:#cbd7e6 transparent}
  *::-webkit-scrollbar{width:9px; height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:#cbd7e6; border-radius:99px}

  .shell{display:grid; grid-template-columns:212px minmax(0,1fr); min-height:100vh}
  .side{background:#fff; border-right:1px solid var(--line); padding:22px 14px; position:sticky; top:0; height:100vh}
  .side .logo{display:flex; align-items:center; gap:9px; padding:0 8px 20px; }
  .side .logo b{font-size:15px; letter-spacing:-.3px}
  .side .logo i{width:9px;height:9px;border-radius:50%;background:var(--blue);
                box-shadow:0 0 0 4px var(--blue-soft); font-style:normal}
  .side nav{display:flex; flex-direction:column; gap:2px}
  .side nav button{
    display:flex; align-items:center; gap:9px; text-align:left; width:100%;
    background:none; border:0; padding:10px 12px; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink-soft); letter-spacing:-.2px;
  }
  .side nav button:hover{background:var(--blue-tint); color:var(--ink)}
  .side nav button.on{background:var(--blue); color:#fff}
  .side .foot{position:absolute; bottom:18px; left:14px; right:14px; font-size:11.5px; color:var(--ink-faint)}
  .side .foot a{display:block; margin-bottom:8px; text-decoration:none; font-weight:600}

  .main{padding:28px 32px 60px; min-width:0}
  .head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap}
  .head h1{margin:0; font-size:21px; letter-spacing:-.5px}
  .head .who{font-size:12.5px; color:var(--ink-faint)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
        box-shadow:var(--shadow); padding:20px 22px; margin-bottom:18px}
  .card h3{margin:0 0 14px; font-size:12px; font-weight:700; letter-spacing:.9px;
           text-transform:uppercase; color:var(--ink-faint)}

  /* 통계 */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:18px}
  .kpi{background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow)}
  .kpi b{display:block; font-size:23px; letter-spacing:-.8px; font-variant-numeric:tabular-nums;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .kpi span{display:block; margin-top:4px; font-size:11.5px; color:var(--ink-faint)}
  .kpi.blue b{color:var(--blue-dark)}

  .bars{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:8px}
  .bars div{flex:1; background:var(--blue-soft); border-radius:5px 5px 0 0; position:relative; min-height:2px}
  .bars div i{position:absolute; inset:auto 0 -19px; text-align:center; font-size:9.5px;
              color:var(--ink-faint); font-style:normal}
  .bars div b{position:absolute; inset:-17px 0 auto; text-align:center; font-size:9.5px;
              color:var(--ink-soft); font-weight:600}
  .bars div.today{background:var(--blue)}

  /* 툴바 */
  .tools{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  input, select, textarea{
    padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit;
    font-size:13px; background:var(--blue-tint); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:0; border-color:var(--blue); background:#fff}
  .grow{flex:1}
  button.b{
    padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:#fff;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  button.b:hover{background:var(--blue-tint); color:var(--ink)}
  button.b.pri{background:var(--blue); border-color:var(--blue); color:#fff}
  button.b.pri:hover{background:var(--blue-dark)}
  button.b.danger{color:var(--red); border-color:#f0dada}
  button.b.danger:hover{background:var(--red-soft)}
  button.b.sm{padding:5px 10px; font-size:12px; border-radius:8px}

  /* 표 */
  .tbl-wrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{
    text-align:left; font-size:11px; font-weight:700; letter-spacing:.5px; color:var(--ink-faint);
    padding:0 10px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  tr:hover td{background:var(--blue-tint)}
  td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
  td.act{text-align:right; white-space:nowrap}
  .tag{display:inline-block; padding:3px 8px; border-radius:7px; font-size:11px; font-weight:700}
  .tag.admin{background:#e9e2fb; color:#5b3fb0}
  .tag.teacher{background:var(--blue-soft); color:var(--blue-dark)}
  .tag.student{background:#eef2f8; color:var(--ink-soft)}
  .tag.ban{background:var(--red-soft); color:var(--red)}
  .tag.hid{background:#f4f0e6; color:#96762e}
  .muted{color:var(--ink-faint)}
  .empty{padding:26px 4px; text-align:center; color:var(--ink-faint); font-size:13px}

  .pager{display:flex; gap:6px; justify-content:center; margin-top:16px}
  .pager button{min-width:30px;height:30px;border:1px solid var(--line);background:#fff;
                border-radius:8px;font-size:12px;color:var(--ink-soft);cursor:pointer}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .pager button:disabled{opacity:.35}

  /* 모달 */
  .back{position:fixed; inset:0; background:rgba(24,40,66,.4); display:none;
        align-items:center; justify-content:center; padding:20px; z-index:50}
  .back.on{display:flex}
  .dlg{background:#fff; border-radius:18px; padding:24px; width:100%; max-width:520px;
       max-height:86vh; overflow:auto; box-shadow:0 24px 60px rgba(24,40,66,.25)}
  .dlg h3{margin:0 0 4px; font-size:17px; letter-spacing:-.4px; text-transform:none;
          color:var(--ink); font-weight:700}
  .dlg .sub{margin:0 0 18px; font-size:12.5px; color:var(--ink-faint)}
  .f{margin-bottom:12px}
  .f label{display:block; font-size:11.5px; font-weight:700; color:var(--ink-faint); margin-bottom:5px}
  .f input, .f select, .f textarea{width:100%}
  .f textarea{min-height:90px; resize:vertical; line-height:1.6}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .dlg-btns{display:flex; gap:8px; justify-content:flex-end; margin-top:18px}
  .err{color:var(--red); font-size:12.5px; min-height:17px; margin:6px 0 0}

  /* 로그인/권한 */
  .gate{max-width:420px; margin:14vh auto; text-align:center}
  .gate .card{padding:34px 28px}
  .gate h2{margin:0 0 10px; font-size:19px; letter-spacing:-.4px}
  .gate p{margin:0 0 20px; color:var(--ink-soft); font-size:13.5px; line-height:1.6}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,16px); opacity:0;
    background:#22314a; color:#fff; padding:12px 18px; border-radius:11px; font-size:13.5px;
    transition:.22s; pointer-events:none; z-index:80;
  }
  #toast.on{opacity:1; transform:translate(-50%,0)}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
          padding:14px 12px}
    .side nav{flex-direction:row; overflow-x:auto; gap:4px; scrollbar-width:none}
    .side nav::-webkit-scrollbar{display:none}
    .side nav button{white-space:nowrap; padding:9px 13px}
    .side .logo{padding:0 4px 12px}
    .side .foot{position:static; margin-top:12px; display:flex; align-items:center; gap:10px}
    .side .foot a{margin:0}
    .side .foot button{margin:0 !important}
    .main{padding:18px 14px calc(46px + env(safe-area-inset-bottom))}
    .head h1{font-size:19px}
  }
  @media (max-width:620px){
    input, select, textarea{font-size:16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi{padding:13px 14px}
    .kpi b{font-size:19px}
    .card{padding:16px 14px; border-radius:14px}
    .back{padding:0; align-items:flex-end}
    .dlg{border-radius:20px 20px 0 0; max-height:92vh;
         padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    .row2{grid-template-columns:1fr}
    table{font-size:12.5px}
    td, th{padding-left:6px; padding-right:6px}
    .tools{gap:6px}
    button.b{padding:8px 11px; font-size:12.5px}
  }
</style>
</head>
<body>

<!-- 로그인 / 권한 안내 -->
<div id="gate" class="gate" style="display:none">
  <div class="card">
    <h2 id="gTitle">관리자 로그인</h2>
    <p id="gText">학교 구글 계정으로 로그인해주세요.</p>
    <button class="b pri" id="gBtn">구글 계정으로 로그인</button>
    <p style="margin-top:16px"><a href="index.html">← 타이머로 돌아가기</a></p>
  </div>
  <p style="margin-top:18px;font-size:11.5px;color:var(--ink-faint)">
    © 2026 김포제일고등학교</p>
</div>

<!-- 관리자 화면 -->
<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div class="logo"><i></i><b>관리자</b></div>
    <nav id="nav">
      <button data-p="dash" class="on">대시보드</button>
      <button data-p="users">사용자</button>
      <button data-p="records">공부 기록</button>
      <button data-p="groups">그룹</button>
      <button data-p="posts">게시글</button>
      <button data-p="comments">댓글</button>
      <button data-p="cats">게시판 설정</button>
      <button data-p="assign">과제</button>
      <button data-p="errors">오류 기록</button>
      <button data-p="blocks">차단 현황</button>
      <button data-p="words">금지어</button>
      <button data-p="settings">사이트 설정</button>
    </nav>
    <div class="foot">
      <a href="index.html">← 타이머 화면</a>
      <span id="whoAmI"></span>
      <button class="b sm" id="logout" style="margin-top:8px">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <h1 id="pageTitle">대시보드</h1>
      <div class="who" id="headNote"></div>
    </div>
    <div id="page"></div>
    <footer style="margin-top:34px;padding:18px 4px 0;border-top:1px solid var(--line);
                   text-align:center;font-size:11.5px;color:var(--ink-faint);line-height:1.9">
      <b style="color:var(--ink-soft)">정보·데이터과학 학습관리 · 관리자</b> · 김포제일고등학교<br>
      © 2026 김포제일고등학교. 이 사이트의 모든 콘텐츠의 저작권은 김포제일고등학교에 있습니다.
    </footer>
  </main>
</div>

<!-- 공용 모달 -->
<div class="back" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="back" id="askBack"><div class="dlg" id="askDlg" style="max-width:400px"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const CFG = window.APP_CONFIG || {};
  const $ = (id)=> document.getElementById(id);
  const esc = (s)=> String(s==null?"":s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const cleanErr = (e)=> String((e&&e.message)||e).replace(/^.*?:\s*/, "");

  let sb = null, meRole = "guest", meNick = "";

  /* ---------- 공통 UI ---------- */
  let toastT;
  function toast(msg){
    $("toast").textContent = msg; $("toast").classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(()=> $("toast").classList.remove("on"), 3000);
  }
  function openDlg(html){ $("dlg").innerHTML = html; $("modal").classList.add("on"); }

  // 브라우저 기본 팝업 대신 쓰는 확인창
  function ask(text, opts){
    opts = opts || {};
    return new Promise((resolve)=>{
      $("askDlg").innerHTML =
        '<h3>' + esc(opts.title || "확인") + '</h3>'
        + '<p class="sub" style="white-space:pre-line;margin-bottom:18px">' + esc(text) + '</p>'
        + (opts.input !== undefined
            ? '<div class="f"><input id="askInput" value="' + esc(opts.input) + '"></div>' : '')
        + '<div class="dlg-btns"><button class="b" id="askNo">취소</button>'
        + '<button class="b ' + (opts.danger ? "danger" : "pri") + '" id="askYes">'
        + esc(opts.yes || "확인") + '</button></div>';
      $("askBack").classList.add("on");
      setTimeout(()=> ($("askInput") || $("askYes")).focus(), 60);

      const close = (v)=>{ $("askBack").classList.remove("on"); resolve(v); };
      $("askYes").onclick = ()=> close(opts.input !== undefined ? ($("askInput").value || "") : true);
      $("askNo").onclick  = ()=> close(opts.input !== undefined ? null : false);
      $("askBack").onclick = (e)=>{ if (e.target.id === "askBack") close(opts.input !== undefined ? null : false); };
      const inp = $("askInput");
      if (inp) inp.onkeydown = (e)=>{ if (e.key === "Enter") $("askYes").click(); };
    });
  }
  function closeDlg(){ $("modal").classList.remove("on"); }
  $("modal").onclick = (e)=>{ if (e.target.id === "modal") closeDlg(); };
  document.addEventListener("keydown", e=>{ if (e.key === "Escape") closeDlg(); });

  const hhm = (sec)=>{
    sec = Math.floor(sec||0);
    const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
    return h ? h+"시간 "+m+"분" : m+"분";
  };
  const dt = (ts)=>{
    if (!ts) return "-";
    const d = new Date(ts);
    return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."
         + String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")
         + ":"+String(d.getMinutes()).padStart(2,"0");
  };
  const ymd = (ts)=> ts ? String(ts).slice(0,10) : "-";

  async function rpc(fn, args){
    const { data, error } = await sb.rpc(fn, args || {});
    if (error) throw error;
    return data;
  }

  /* ---------- 진입 ---------- */
  async function boot(){
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase){
      $("gate").style.display = "block";
      $("gTitle").textContent = "서버가 연결되지 않았어요";
      $("gText").textContent = "config.js 에 Supabase 주소와 키를 넣어주세요.";
      $("gBtn").style.display = "none";
      return;
    }
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange(()=> check());
    check();
  }

  async function check(){
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ showGate("관리자 로그인", "학교 구글 계정으로 로그인해주세요.", true); return; }

    let info = null;
    try { info = await rpc("am_i_admin"); } catch(e){}
    meRole = (info && info.role) || "guest";
    meNick = (info && info.nickname) || "";

    if (meRole !== "admin"){
      showGate("접근 권한이 없어요",
        "이 페이지는 관리자만 볼 수 있어요. 관리자 계정으로 로그인하거나, "
        + "관리자에게 권한을 요청하세요. (현재: " + esc(session.user.email || "") + ")", false);
      return;
    }
    $("gate").style.display = "none";
    $("shell").style.display = "grid";
    $("whoAmI").textContent = meNick + " · 관리자";
    go("dash");
  }

  function showGate(title, text, showLogin){
    $("shell").style.display = "none";
    $("gate").style.display = "block";
    $("gTitle").textContent = title;
    $("gText").textContent = text;
    $("gBtn").style.display = showLogin ? "" : "none";
    $("gBtn").textContent = "구글 계정으로 로그인";
  }

  $("gBtn").onclick = ()=>{
    const q = { prompt:"select_account" };
    if (CFG.SCHOOL_DOMAIN) q.hd = CFG.SCHOOL_DOMAIN;
    sb.auth.signInWithOAuth({ provider:"google",
      options:{ redirectTo: location.href.split("#")[0], queryParams:q }});
  };
  $("logout").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

  /* ---------- 라우팅 ---------- */
  const PAGES = {
    dash:     ["대시보드",     pageDash],
    users:    ["사용자",       pageUsers],
    records:  ["공부 기록",    pageRecords],
    groups:   ["그룹",         pageGroups],
    posts:    ["게시글",       pagePosts],
    comments: ["댓글",         pageComments],
    cats:     ["게시판 설정",  pageCats],
    assign:   ["과제 제출 현황", pageAssign],
    errors:   ["오류 기록",    pageErrors],
    blocks:   ["차단 현황",    pageBlocks],
    words:    ["금지어 관리",  pageWords],
    settings: ["사이트 설정",  pageSettings]
  };
  function go(p){
    const [title, fn] = PAGES[p] || PAGES.dash;
    document.querySelectorAll("#nav button").forEach(b=> b.classList.toggle("on", b.dataset.p === p));
    $("pageTitle").textContent = title;
    $("headNote").textContent = "";
    $("page").innerHTML = '<div class="card"><div class="empty">불러오는 중…</div></div>';
    fn().catch(e=> $("page").innerHTML = '<div class="card"><div class="empty">'+esc(cleanErr(e))+'</div></div>');
  }
  $("nav").onclick = (e)=>{ const b = e.target.closest("button[data-p]"); if (b) go(b.dataset.p); };

  /* ===================== 대시보드 ===================== */
  async function pageDash(){
    const s = await rpc("admin_stats");
    const daily = await rpc("admin_daily", { p_days: 14 });
    let tr = null; try { tr = await rpc("admin_traffic"); } catch(e){}
    const max = Math.max(1, ...daily.map(d=> Number(d.seconds)));

    $("page").innerHTML =
      '<div class="kpis">'
      + kpi(s.users, "전체 사용자", true)
      + kpi(s.users_today, "오늘 공부한 사람")
      + kpi(Math.floor(s.seconds_today/3600) + "h " + Math.floor(s.seconds_today%3600/60) + "m", "오늘 총 공부시간")
      + kpi(Math.floor(s.seconds_all/3600) + "시간", "누적 공부시간")
      + kpi(s.sessions_today, "오늘 세션 수")
      + kpi(s.groups, "그룹")
      + kpi(s.posts, "게시글")
      + kpi(s.comments, "댓글")
      + '</div>'
      + '<div class="card"><h3>최근 14일 공부량</h3><div class="bars">'
      + daily.map((d,i)=>{
          const h = Math.round(Number(d.seconds)/max*100);
          return '<div class="'+(i===daily.length-1?"today":"")+'" style="height:'+Math.max(h,2)+'%">'
               + '<b>'+(Number(d.seconds) ? Math.round(Number(d.seconds)/3600)+"h" : "")+'</b>'
               + '<i>'+String(d.day).slice(5).replace("-","/")+'</i></div>';
        }).join("")
      + '</div><div style="height:22px"></div></div>'
      + (tr ? trafficCard(tr) : "")
      + '<div class="card"><h3>알아두기</h3>'
      + '<p style="margin:0;font-size:13px;color:var(--ink-soft);line-height:1.8">'
      + '· 정지된 계정: <b>'+s.banned+'</b>명 · 최근 7일 신규 가입: <b>'+s.new_users_7d+'</b>명<br>'
      + '· 기록이 비정상적으로 많은 학생은 <b>공부 기록</b> 메뉴에서 날짜별로 수정·삭제할 수 있어요.'
      + '</p></div>';
  }
  const mb = (b)=>{
    b = Number(b||0);
    if (b >= 1073741824) return (b/1073741824).toFixed(2) + "GB";
    if (b >= 1048576) return (b/1048576).toFixed(1) + "MB";
    return Math.round(b/1024) + "KB";
  };

  function trafficCard(t){
    const used = Number(t.month_bytes || 0);
    const pct  = Math.min(100, Math.round(used / (5 * 1073741824) * 1000) / 10);
    const stored = Number(t.stored || 0);
    const spct = Math.min(100, Math.round(stored / 1073741824 * 1000) / 10);
    const bar = (p, warn)=>
      '<div style="height:9px;background:#eef3fa;border-radius:99px;overflow:hidden;margin:8px 0 6px">'
      + '<div style="height:100%;width:'+Math.max(p,1)+'%;border-radius:99px;background:'
      + (warn ? "#d9694f" : "var(--blue)") + '"></div></div>';

    return '<div class="card"><h3>첨부파일 사용량 (무료 플랜 기준)</h3>'
      + '<div style="font-size:13px;color:var(--ink-soft);line-height:1.9">'
      + '<b>이번 달 전송량</b> ' + mb(used) + ' / 5GB (' + pct + '%) · 다운로드 '
      +   (t.month_count||0) + '회'
      + bar(pct, pct > 70)
      + '<b>저장된 파일</b> ' + mb(stored) + ' / 1GB (' + spct + '%) · ' + (t.files||0) + '개'
      + bar(spct, spct > 70)
      + '<p class="muted" style="margin:10px 0 0;font-size:11.5px;line-height:1.7">'
      + '전송량은 학생이 첨부파일을 내려받은 양을 앱에서 집계한 값이라 실제 수치와 조금 다를 수 있어요. '
      + '70%를 넘으면 큰 파일은 유튜브·구글드라이브 링크로 돌리는 걸 권해요.</p></div></div>';
  }

    pager($("pPager"), total, 30, pPage, n=>{ pPage = n; loadPosts(); });

    $("pBody").querySelectorAll("[data-pin]").forEach(b=> b.onclick = async ()=>{
      await rpc("admin_set_post", { p_id:Number(b.dataset.pin), p_pinned: b.dataset.v === "true" });
      loadPosts();
    });
    $("pBody").querySelectorAll("[data-hid]").forEach(b=> b.onclick = async ()=>{
      await rpc("admin_set_post", { p_id:Number(b.dataset.hid), p_hidden: b.dataset.v === "true" });
      loadPosts();
    });
    $("pBody").querySelectorAll("[data-pd]").forEach(b=> b.onclick = async ()=>{
      if (!await ask("글과 댓글, 첨부파일을 모두 삭제할까요?", { title:"글 삭제", yes:"삭제", danger:true })) return;
      const id = Number(b.dataset.pd);
      // 첨부파일은 저장소에서도 지웁니다 (폴더 이름 = 글 번호)
      try{
        const { data: files } = await sb.storage.from("attachments").list(String(id));
        if (files && files.length)
          await sb.storage.from("attachments").remove(files.map(f=> id + "/" + f.name));
      }catch(e){}
      await rpc("delete_post", { p_id: id });
      toast("삭제했어요."); loadPosts();
    });
  }

    const total = rows.length ? Number(rows[0].total) : 0;
    $("cBody").innerHTML = rows.length ? rows.map(c=>
      '<tr><td>'+esc(c.body.length > 60 ? c.body.slice(0,60)+"…" : c.body)+'</td>'

      if (!await ask("댓글을 삭제할까요?", { title:"댓글 삭제", yes:"삭제", danger:true })) return;

      + '</select></div></div>'

      + '</select></div>'
      + '<div class="f"><label>상태</label><select id="kArch">'
      +   '<option value="false"'+(!c||!c.archived?" selected":"")+'>사용 중</option>'

      + '</select></div>'

          { p_id: c ? c.id : savedId, p_kind: $("kKind").value }).catch(()=>{});
        closeDlg(); toast("저장했어요."); pageCats();
      }catch(e){ $("kErr").textContent = cleanErr(e); }
    };
  }

  async function openUserDetail(id){
    const d = await rpc("admin_user_detail", { p_id: id });
    const hm2 = (s)=> hhm(Number(s||0));
    const days = d.recent_days || [];
    const maxD = Math.max(1, ...days.map(x=> Number(x.seconds)));
    const subs = d.subjects || [];
    const maxS = Math.max(1, ...subs.map(x=> Number(x.seconds)));

    openDlg(
      '<h3>'+esc(d.nickname)+' <span class="tag '+d.role+'">'+d.role+'</span></h3>'
      + '<p class="sub">'+esc(d.email)+' · 가입 '+ymd(d.joined)+'</p>'
      + '<div class="kpis" style="margin-bottom:14px">'
      +   kpi(hm2(d.today_seconds), "오늘", true) + kpi(hm2(d.week_seconds), "이번 주")
      +   kpi(Math.floor(Number(d.total_seconds||0)/3600)+"시간", "누적")
      +   kpi((d.study_days||0)+"일", "공부한 날")
      + '</div>'
      + '<div class="f"><label>최근 14일</label><div class="bars" style="height:70px">'
      +   days.slice().reverse().map(x=>'<div style="height:'
      +     Math.max(2, Math.round(Number(x.seconds)/maxD*100))+'%" title="'+x.day+'"></div>').join("")
      + '</div></div>'
      + (subs.length
          ? '<div class="f"><label>과목별</label>'
            + subs.map(x=>'<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:12.5px">'
              + '<span style="width:46px;color:var(--ink-soft)">'+esc(x.subject)+'</span>'
              + '<span style="flex:1;height:8px;background:var(--blue-tint);border-radius:99px;overflow:hidden">'
              + '<i style="display:block;height:100%;width:'+Math.round(Number(x.seconds)/maxS*100)+'%;background:var(--blue)"></i></span>'
              + '<span class="muted">'+hm2(x.seconds)+'</span></div>').join("") + '</div>'
          : '')
      + '<div class="f"><label>활동</label><p class="muted" style="margin:0;font-size:12.5px;line-height:1.9">'
      +   '글 <b>'+(d.posts||0)+'</b> · 댓글 <b>'+(d.comments||0)+'</b>'
      +   (Number(d.flagged) ? ' · <span style="color:var(--red)">표시된 글·댓글 '+d.flagged+'</span>' : '')
      +   '<br>차단당함 <b>'+(d.blocked_by||0)+'</b> · 차단함 <b>'+(d.blocking||0)+'</b>'
      +   '<br>그룹: '+((d.groups||[]).map(esc).join(", ") || "없음")
      +   '<br>마지막 기록: '+(d.last_day ? ymd(d.last_day) : "없음")+'</p></div>'
      + ((d.recent_posts||[]).length
          ? '<div class="f"><label>최근 글</label>'
            + d.recent_posts.map(r=>'<div style="font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)">'
              + esc(r.title)+' <span class="muted">'+ymd(r.at)+'</span></div>').join("") + '</div>'
          : '')
      + '<div class="dlg-btns"><button class="b" id="udClose">닫기</button></div>');

        + '<p class="muted" style="margin:-6px 0 12px;font-size:12.5px">'
        + '게시판 설정에서 종류를 <b>과제</b>로 지정한 게시판의 글이 과제가 됩니다.</p>'
        + '<div class="tbl-wrap"><table><tbody>'
        + (rows.length ? rows.map(p=>
            '<tr><td><b>'+esc(p.title)+'</b> <span class="muted">'+esc(p.category_name)+'</span></td>'
            + '<td class="num muted">'+ymd(p.created_at)+'</td>'
            + '<td class="act"><button class="b sm" data-ap="'+p.id+'" data-t="'+esc(p.title)+'">제출 현황</button></td></tr>').join("")
          : '<tr><td class="empty">글이 없어요.</td></tr>')
        + '</tbody></table></div></div>';
      $("page").querySelectorAll("[data-ap]").forEach(b=> b.onclick = ()=>{
        assignPost = { id: Number(b.dataset.ap), title: b.dataset.t }; pageAssign();
      });
      return;
    }

    let rows = [];
    try { rows = await rpc("assignment_list", { p_post: assignPost.id }); }
    catch(e){
      $("page").innerHTML = '<div class="card"><div class="empty">'+esc(cleanErr(e))+'</div>'
        + '<div class="dlg-btns"><button class="b" id="aBack">← 다른 과제</button></div></div>';
      $("aBack").onclick = ()=>{ assignPost = null; pageAssign(); };
      return;
    }
    const done = rows.filter(r=> r.submitted).length;
    $("headNote").textContent = assignPost.title;

    $("page").innerHTML =
      '<div class="card"><div class="tools">'
      + '<button class="b" id="aBack">← 다른 과제</button><span class="grow"></span>'
      + '<span class="muted">제출 '+done+' / '+rows.length+'명</span>'
      + '<button class="b" id="aCsv">CSV</button></div>'
      + '<div class="tbl-wrap"><table><thead><tr>'
      + '<th>학생</th><th>상태</th><th>제출 내용</th><th>제출 시각</th><th></th>'
      + '</tr></thead><tbody>'
      + rows.map(r=>
          '<tr><td><b>'+esc(r.nickname)+'</b></td>'
          + '<td>'+(r.submitted
              ? (r.checked ? '<span class="tag teacher">확인함</span>'
                           : '<span class="tag student">제출</span>')
                + (r.late ? ' <span class="tag ban">지각</span>' : '')
              : '<span class="tag hid">미제출</span>')+'</td>'
          + '<td style="max-width:320px">'+esc((r.body||"").slice(0,90))+(r.body&&r.body.length>90?'…':'')+'</td>'
          + '<td class="num muted">'+(r.at ? dt(r.at) : '-')+'</td>'
          + '<td class="act">'+(r.submitted
              ? '<button class="b sm" data-gr="'+r.user_id+'" data-n="'+esc(r.nickname)+'">확인·피드백</button>' : '')+'</td></tr>').join("")
      + '</tbody></table></div></div>';

    $("aBack").onclick = ()=>{ assignPost = null; $("headNote").textContent=""; pageAssign(); };
    $("aCsv").onclick = ()=>{
      const head = "학생,상태,지각,제출시각,내용";
      const body = rows.map(r=> [r.nickname, r.submitted?"제출":"미제출", r.late?"지각":"",
        r.at?dt(r.at):"", '"'+String(r.body||"").replace(/"/g,'""').replace(/\n/g," ")+'"'].join(",")).join("\n");
      downloadText(assignPost.title+"_제출현황.csv", "\uFEFF"+head+"\n"+body);
    };
    $("page").querySelectorAll("[data-gr]").forEach(b=> b.onclick = async ()=>{
      const r = rows.find(x=> x.user_id === b.dataset.gr);
      const fb = await ask(r.nickname + " 학생에게 남길 한마디 (비워도 돼요)",
                           { title:"과제 확인", yes:"확인 처리", input: r.feedback || "" });
      if (fb === null) return;
      await rpc("grade_submission", { p_post: assignPost.id, p_user: r.user_id,
                                      p_feedback: fb, p_checked: true });
      toast("확인 처리했어요."); pageAssign();
    });
  }

  function downloadText(name, text){
    const blob = new Blob([text], { type:"text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
  }

  /* ===================== 차단 현황 ===================== */
  async function pageBlocks(){
    const stats = await rpc("admin_block_stats");
    const list  = await rpc("admin_blocks", { p_limit: 100 });
    const risky = stats.filter(s=> s.blocked_by >= 3);

    $("page").innerHTML =
      (risky.length
        ? '<div class="card" style="border-color:#f0dada;background:#fdf7f6">'
          + '<h3 style="color:#b3564f">살펴볼 학생</h3>'
          + '<p style="margin:0 0 10px;font-size:13px;color:var(--ink-soft);line-height:1.8">'
          + '3명 이상에게 차단당한 학생이에요. 따돌림이나 갈등의 신호일 수 있으니 한 번 확인해보세요. '
          + '반대로 그 학생이 문제 행동을 했을 수도 있어요.</p>'
          + risky.map(s=>'<div style="padding:8px 0;font-size:14px"><b>'+esc(s.nickname)+'</b> '
              + '<span class="muted">— '+s.blocked_by+'명에게 차단당함</span></div>').join("")
          + '</div>'
        : '')
      + '<div class="card"><h3>사람별 집계</h3><div class="tbl-wrap"><table><thead><tr>'
      + '<th>닉네임</th><th>차단당한 수</th><th>차단한 수</th><th>마지막 차단</th>'
      + '</tr></thead><tbody>'
      + (stats.length ? stats.map(s=>
          '<tr><td><b>'+esc(s.nickname)+'</b></td>'
          + '<td class="num">'+(s.blocked_by ? '<span class="tag ban">'+s.blocked_by+'</span>' : '0')+'</td>'
          + '<td class="num muted">'+s.blocking+'</td>'
          + '<td class="num muted">'+(s.last_at ? ymd(s.last_at) : '-')+'</td></tr>').join("")
        : '<tr><td colspan="4" class="empty">차단 기록이 없어요.</td></tr>')
      + '</tbody></table></div></div>'
      + '<div class="card"><h3>최근 차단 내역</h3><div class="tbl-wrap"><table><thead><tr>'
      + '<th>차단한 사람</th><th></th><th>차단당한 사람</th><th>시각</th>'
      + '</tr></thead><tbody>'
      + (list.length ? list.map(b=>
          '<tr><td>'+esc(b.blocker || "-")+'</td><td class="muted">→</td>'
          + '<td><b>'+esc(b.blocked || "-")+'</b></td>'
          + '<td class="num muted">'+dt(b.created_at)+'</td></tr>').join("")
        : '<tr><td colspan="4" class="empty">차단 기록이 없어요.</td></tr>')
      + '</tbody></table></div>'
      + '<p class="muted" style="margin:14px 0 0;font-size:12px;line-height:1.9">'
      + '· 이 화면은 <b>관리자에게만</b> 보입니다. 학생 화면에는 차단 사실이 어떤 형태로도 드러나지 않아요.<br>'
      + '· 차단은 학생이 스스로를 보호하는 정상적인 기능이기도 합니다. 숫자 하나로 단정하지 말고 '
      + '흐름을 보세요. 갑자기 여러 명이 같은 학생을 차단했다면 그 시점에 무슨 일이 있었는지 확인해볼 만합니다.<br>'
      + '· 관리자가 차단을 대신 풀어줄 수는 없습니다. 학생 본인만 해제할 수 있어요.</p></div>';
  }

  /* ===================== 금지어 관리 ===================== */
  async function pageWords(){
    const rows = await rpc("admin_banned_words");
    $("page").innerHTML =
      '<div class="card"><div class="tools">'
      + '<input id="wNew" placeholder="추가할 단어 (2글자 이상)" style="flex:1;max-width:260px">'
      + '<button class="b pri" id="wAdd">추가</button>'
      + '<span class="grow"></span><span class="muted">' + rows.length + '개</span></div>'
      + '<div class="tbl-wrap"><table><thead><tr><th>단어</th><th>등록일</th><th></th></tr></thead><tbody>'
      + (rows.length ? rows.map(w=>
          '<tr><td><b>'+esc(w.word)+'</b></td>'
          + '<td class="num muted">'+ymd(w.created_at)+'</td>'
          + '<td class="act"><button class="b sm danger" data-wx="'+esc(w.word)+'">삭제</button></td></tr>').join("")
        : '<tr><td colspan="3" class="empty">등록된 금지어가 없어요.</td></tr>')
      + '</tbody></table></div>'
      + '<p class="muted" style="margin:14px 0 0;font-size:12px;line-height:1.9">'
      + '· 글·댓글의 제목과 내용에 이 단어가 들어가면 <b>작성은 되지만 작성자가 지울 수 없게</b> 잠깁니다. '
      + '관리자에게 알림도 갑니다.<br>'
      + '· 띄어쓰기와 특수문자를 지우고 비교하므로 <b>ㅅ.ㅂ</b> 같은 우회도 일부 걸러집니다.<br>'
      + '· 너무 짧거나 흔한 단어를 넣으면 멀쩡한 글이 잠길 수 있으니 주의하세요.</p></div>';

    const add = async ()=>{
      const v = $("wNew").value.trim();
      if (!v) return;
      try { await rpc("admin_add_banned_word", { p_word: v }); toast("추가했어요."); pageWords(); }
      catch(e){ toast(cleanErr(e)); }
    };
    $("wAdd").onclick = add;
    $("wNew").onkeydown = (e)=>{ if (e.key === "Enter") add(); };
    $("page").querySelectorAll("[data-wx]").forEach(b=> b.onclick = async ()=>{
      if (!await ask('"'+b.dataset.wx+'" 를 금지어에서 뺄까요?',
                     { title:"금지어 삭제", yes:"삭제", danger:true })) return;
      await rpc("admin_delete_banned_word", { p_word: b.dataset.wx });
      toast("삭제했어요."); pageWords();
    });
  }

  /* ===================== 사이트 설정 ===================== */
  let banners = [];

  function parseBanners(v){
    if (!v) return [];
    try {
      const a = JSON.parse(v);
      if (Array.isArray(a)) return a.map(x=> String(x)).filter(s=> s.trim());
      if (typeof a === "string") return a.trim() ? [a] : [];
    } catch(e){}
    return String(v).trim() ? [String(v)] : [];
  }

  async function pageSettings(){
    const ss = await rpc("admin_settings");
    const get = (k)=> (ss.find(s=> s.key === k) || {}).value || "";
    banners = parseBanners(get("notice_banner"));

    const yn = (k, label, help)=>
      '<div class="f"><label>'+label+'</label><select id="'+k+'">'
      + '<option value="true"'  + (get(k) !== "false" ? " selected" : "") + '>사용함</option>'
      + '<option value="false"' + (get(k) === "false" ? " selected" : "") + '>사용 안 함</option>'
      + '</select><p class="muted" style="margin:5px 0 0;font-size:11.5px">'+help+'</p></div>';

    $("page").innerHTML =
      '<div class="card"><h3>공지 배너</h3>'
      + '<p class="muted" style="margin:-6px 0 14px;font-size:12px">'
      + '타이머·커뮤니티 화면 맨 위에 표시됩니다. 여러 개를 넣으면 위에서부터 순서대로 쌓입니다 (최대 5개).</p>'
      + '<div id="bList"></div>'
      + '<button class="b" id="bAdd" style="margin-top:8px">+ 배너 추가</button>'
      + '</div>'
      + '<div class="card"><h3>기능 켜고 끄기</h3>'
      + yn("board_enabled",   "커뮤니티",
           "끄면 학생 화면에서 커뮤니티 탭이 사라집니다. 글과 자료는 지워지지 않습니다.")
      + yn("ranking_enabled", "랭킹",
           "끄면 랭킹 카드가 숨겨집니다. 공부 기록은 계속 쌓입니다.")
      + '</div>'
      + '<div class="card"><div class="dlg-btns" style="margin:0">'
      + '<button class="b pri" id="sSave">전체 저장</button></div></div>'
      + '<div class="card"><h3>참고</h3>'
      + '<p style="margin:0;font-size:13px;color:var(--ink-soft);line-height:1.8">'
      + '· 학교 도메인 제한과 하루 공부시간 상한은 데이터베이스에서 관리합니다.<br>'
      + '· 관리자 지정은 <b>사용자</b> 메뉴에서 역할을 admin 으로 바꾸면 됩니다.</p></div>';

    renderBanners();
    $("bAdd").onclick = ()=>{
      if (banners.length >= 5){ toast("배너는 5개까지예요."); return; }
      banners.push(""); renderBanners();
      const inputs = $("bList").querySelectorAll("input");
      if (inputs.length) inputs[inputs.length-1].focus();
    };
    $("sSave").onclick = async ()=>{
      collectBanners();
      const clean = banners.filter(t=> t.trim());
      await rpc("admin_set_setting", { p_key: "notice_banner", p_value: JSON.stringify(clean) });
      await rpc("admin_set_setting", { p_key: "board_enabled",   p_value: $("board_enabled").value });
      await rpc("admin_set_setting", { p_key: "ranking_enabled", p_value: $("ranking_enabled").value });
      banners = clean; renderBanners();
      toast("저장했어요. 학생 화면은 새로고침하면 반영됩니다.");
    };
  }

  function collectBanners(){
    banners = Array.from($("bList").querySelectorAll("input")).map(i=> i.value);
  }

  function renderBanners(){
    const box = $("bList");
    if (!banners.length){
      box.innerHTML = '<p class="muted" style="font-size:12.5px;margin:0">'
        + '배너가 없습니다. 아래 버튼으로 추가하세요.</p>';
      return;
    }
    box.innerHTML = banners.map((t,i)=>
      '<div style="display:flex;gap:8px;margin-bottom:8px">'
      + '<span class="muted" style="width:18px;line-height:36px;text-align:center">'+(i+1)+'</span>'
      + '<input value="'+esc(t)+'" maxlength="120" placeholder="예) 중간고사 D-14, 다들 화이팅!" style="flex:1">'
      + '<button class="b danger" data-bx="'+i+'">삭제</button></div>').join("");
    box.querySelectorAll("[data-bx]").forEach(b=> b.onclick = ()=>{
      collectBanners();
      banners.splice(Number(b.dataset.bx), 1);
      renderBanners();
    });
  }

  /* ---------- 페이지네이션 ---------- */
  function pager(el, total, size, cur, onGo){
    const pages = Math.ceil(total / size);
    if (pages <= 1){ el.innerHTML = ""; return; }
    const from = Math.max(0, Math.min(cur - 3, pages - 7)), to = Math.min(pages, from + 7);
    let h = '<button data-g="'+(cur-1)+'"'+(cur===0?" disabled":"")+'>‹</button>';
    for (let i = from; i < to; i++)
      h += '<button data-g="'+i+'" class="'+(i===cur?"on":"")+'">'+(i+1)+'</button>';
    h += '<button data-g="'+(cur+1)+'"'+(cur>=pages-1?" disabled":"")+'>›</button>';
    el.innerHTML = h;
    el.onclick = (e)=>{
      const b = e.target.closest("button[data-g]");
      if (b && !b.disabled) onGo(Number(b.dataset.g));
    };
  }

  boot();
})();
</script>
</body>
</html>
